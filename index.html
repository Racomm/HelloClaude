<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Projects</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --fg: #1f2933;
      --card: rgba(255, 255, 255, 0.78);
      --border: rgba(31, 41, 51, 0.12);
      --accent: #b85c38;
      --accent-2: #2f6f62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--fg);
      background:
        radial-gradient(circle at top, rgba(184, 92, 56, 0.18), transparent 34%),
        linear-gradient(180deg, #f7f2e8 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(820px, 100%);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 48px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.2rem);
    }

    p {
      margin: 0 0 20px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.74);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .card a {
      color: inherit;
      text-decoration: none;
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
    }

    .dino a {
      background: var(--accent-2);
      color: #fff;
    }

    .drunkard a {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Game Projects</h1>
    <p>当前仓库已拆分为两个独立项目，分别进入各自目录开发和部署。</p>
    <div class="grid">
      <section class="card dino">
        <h2>Chrome Dino Game</h2>
        <p>PWA 跑酷游戏，入口位于 <code>dino-game/index.html</code>。</p>
        <a href="./dino-game/index.html">Open Dino Game</a>
      </section>
      <section class="card drunkard">
        <h2>醉翁觅酒</h2>
        <p>休闲收集游戏，入口位于 <code>drunkard-game/index.html</code>。</p>
        <a href="./drunkard-game/">Open Drunkard Game</a>
      </section>
    </div>
  </main>
</body>
</html>
